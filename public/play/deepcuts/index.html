<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=393, initial-scale=1.0, viewport-fit=cover" />
  <title>Deep Cuts</title>

  <!--
    The embedded copy of the deep cuts prototype.

    The original runs from a node server and compiles itself in the browser:
    react, react-dom and framer-motion come from esm.sh through an importmap,
    babel standalone compiles the 2,600-line source on every load, and the
    journey is generated by an express route. None of that survives a portfolio
    page, and none of it should: the other builds here are self-contained, and
    a case study that 404s because unpkg is having a bad afternoon is worse
    than no case study.

    So: the source is bundled ahead of time into app.js (react 18.3.1 and
    framer-motion 11.3.19 pinned, as the importmap asked for), the fonts are
    vendored next to it, and the server pipeline runs in the page from api.js.
    Nothing here reaches the network after the page has loaded.
  -->

  <!-- Geist and Geist Mono, latin subset, served from this origin. Both are
       variable fonts, so one file per family covers the 400/500/600 the ui
       uses. swap keeps text visible while they load. -->
  <style>
    @font-face {
      font-family: 'Geist';
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url('./fonts/geist-latin.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Geist Mono';
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url('./fonts/geist-mono-latin.woff2') format('woff2');
    }

    html, body { margin: 0; padding: 0; background: #070808; height: 100%;
      font-family: 'Geist', system-ui, sans-serif; }
    #root { display: flex; justify-content: center; align-items: flex-start; min-height: 100%; }
    * { box-sizing: border-box; }
    @keyframes dc_blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- The server, in the page. Must run before the app so the patched fetch is
       in place by the time the first journey step is posted. -->
  <script src="./api.js"></script>
  <script src="./app.js"></script>
</body>
</html>
