<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- Kochi Water Metro · a boarding pass for the first operating route,
       with the channel traced across the stub. Both languages are carried as
       labels rather than set copy, so the plate needs no Malayalam webfont. -->
  <style>
    .m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #16171A; }
    .q { opacity: .45; }
  </style>
  <rect width="1000" height="1000" fill="#E7E5DF"/>
  <g transform="rotate(-2 500 500)">
    <rect x="168" y="268" width="664" height="464" fill="#F7F5EF"/>
    <rect x="168" y="268" width="664" height="464" fill="none" stroke="#16171A" stroke-width="2"/>
    <!-- perforation between pass and stub -->
    <line x1="648" y1="268" x2="648" y2="732" stroke="#16171A" stroke-width="1.5" stroke-dasharray="5 7" opacity=".55"/>
    <g class="m">
      <text x="204" y="330" font-size="16" letter-spacing="2.5" class="q">KOCHI WATER METRO</text>
      <text x="204" y="378" font-size="30" font-weight="700" letter-spacing=".5">BOARDING PASS</text>

      <text x="204" y="452" font-size="15" letter-spacing="2" class="q">FROM</text>
      <text x="204" y="486" font-size="24" font-weight="700">HIGH COURT</text>
      <text x="204" y="546" font-size="15" letter-spacing="2" class="q">TO</text>
      <text x="204" y="580" font-size="24" font-weight="700">VYPIN</text>

      <!-- the channel, hand-traced so the ferry never crosses land -->
      <path d="M204 632 C268 612 300 664 364 644 C428 624 460 676 524 656 C560 645 584 660 612 654"
            fill="none" stroke="#16171A" stroke-width="2.5"/>
      <circle cx="204" cy="632" r="7" fill="#16171A"/>
      <circle cx="612" cy="654" r="7" fill="none" stroke="#16171A" stroke-width="2.5"/>

      <text x="204" y="700" font-size="15" letter-spacing="2" class="q">EN · ML</text>
      <text x="612" y="700" font-size="15" letter-spacing="2" text-anchor="end" class="q">OFFLINE</text>

      <!-- stub -->
      <text x="740" y="338" font-size="15" letter-spacing="2" text-anchor="middle" class="q">SEAT</text>
      <text x="740" y="382" font-size="34" font-weight="700" text-anchor="middle">07</text>
      <text x="740" y="470" font-size="15" letter-spacing="2" text-anchor="middle" class="q">DECK</text>
      <text x="740" y="514" font-size="34" font-weight="700" text-anchor="middle">A</text>
      <circle cx="740" cy="612" r="9" fill="#DE723B"/>
      <text x="740" y="678" font-size="14" letter-spacing="1.5" text-anchor="middle" class="q">NO SIGNAL</text>
      <text x="740" y="700" font-size="14" letter-spacing="1.5" text-anchor="middle" class="q">REQUIRED</text>
    </g>
  </g>
</svg>
