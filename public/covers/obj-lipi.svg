<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- Lipi · the layout report as a printed card. The scan figures are the
       ones from the checkout run: four scripts, six screens each, eleven
       findings rolled up to one component. -->
  <style>
    .m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #16171A; }
    .q { opacity: .45; }
  </style>
  <rect width="1000" height="1000" fill="#E7E5DF"/>
  <g transform="rotate(-3 500 500)">
    <rect x="212" y="146" width="576" height="708" fill="#F7F5EF"/>
    <rect x="212" y="146" width="576" height="708" fill="none" stroke="#16171A" stroke-width="2"/>
    <!-- punched filing hole, so it reads as a card and not a panel -->
    <circle cx="500" cy="196" r="13" fill="#E7E5DF" stroke="#16171A" stroke-width="2"/>
    <g class="m">
      <text x="252" y="268" font-size="17" letter-spacing="2.5" class="q">LIPI</text>
      <text x="252" y="312" font-size="31" font-weight="700" letter-spacing=".5">LAYOUT REPORT</text>
      <line x1="252" y1="340" x2="748" y2="340" stroke="#16171A" stroke-width="1.5" stroke-dasharray="3 5" opacity=".45"/>

      <text x="252" y="382" font-size="17" letter-spacing="1.5" class="q">SCRIPTS</text>
      <text x="748" y="382" font-size="17" letter-spacing="1.5" text-anchor="end">HI · TA · BN · KN</text>
      <text x="252" y="414" font-size="17" letter-spacing="1.5" class="q">SCREENS</text>
      <text x="748" y="414" font-size="17" letter-spacing="1.5" text-anchor="end">24</text>
      <text x="252" y="446" font-size="17" letter-spacing="1.5" class="q">FINDINGS</text>
      <text x="748" y="446" font-size="17" letter-spacing="1.5" text-anchor="end">11</text>

      <line x1="252" y1="482" x2="748" y2="482" stroke="#16171A" stroke-width="1.5" stroke-dasharray="3 5" opacity=".45"/>

      <!-- the measurement itself: the label that fits, the one that does not -->
      <text x="252" y="522" font-size="15" letter-spacing="2" class="q">EN</text>
      <rect x="252" y="536" width="300" height="52" fill="none" stroke="#16171A" stroke-width="2"/>
      <rect x="272" y="554" width="104" height="16" fill="#16171A"/>
      <text x="748" y="572" font-size="16" letter-spacing="1" text-anchor="end" class="q">FITS</text>

      <text x="252" y="626" font-size="15" letter-spacing="2" class="q">HI</text>
      <rect x="252" y="640" width="300" height="52" fill="none" stroke="#16171A" stroke-width="2"/>
      <rect x="272" y="658" width="280" height="16" fill="#16171A"/>
      <rect x="552" y="658" width="84" height="16" fill="#DE723B"/>
      <text x="748" y="676" font-size="16" letter-spacing="1" text-anchor="end" fill="#B4522A">+28%</text>

      <line x1="252" y1="726" x2="748" y2="726" stroke="#16171A" stroke-width="1.5" stroke-dasharray="3 5" opacity=".45"/>
      <text x="252" y="766" font-size="15" letter-spacing="2" class="q">ROOT CAUSE</text>
      <text x="252" y="806" font-size="25" font-weight="700" letter-spacing=".5">3 SCREENS</text>
      <text x="252" y="806" font-size="25" font-weight="700" letter-spacing=".5" opacity="0">x</text>
      <text x="748" y="806" font-size="25" font-weight="700" letter-spacing=".5" text-anchor="end">1 COMPONENT</text>
      <circle cx="500" cy="798" r="6" fill="#DE723B"/>
    </g>
  </g>
</svg>
