<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- Airtribe Learn · a lesson as something authored. The four intake answers
       on the plate, the concept map building beside it, and a footnote marker
       because every claim traces to a source. The seeded lesson is the real one. -->
  <style>
    .m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #16171A; }
    .q { opacity: .45; }
  </style>
  <rect width="1000" height="1000" fill="#E7E5DF"/>
  <g transform="rotate(-2 500 500)">
    <rect x="178" y="170" width="644" height="660" fill="#F7F5EF"/>
    <rect x="178" y="170" width="644" height="660" fill="none" stroke="#16171A" stroke-width="2"/>
    <g class="m">
      <text x="216" y="232" font-size="16" letter-spacing="2.5" class="q">LESSON 01</text>
      <text x="216" y="282" font-size="29" font-weight="700" letter-spacing=".5">THE HARD PROBLEM</text>
      <text x="216" y="318" font-size="29" font-weight="700" letter-spacing=".5">OF CONSCIOUSNESS</text>
      <!-- the footnote marker: the whole posture of the product -->
      <text x="686" y="268" font-size="17" fill="#B4522A">[1]</text>

      <line x1="216" y1="350" x2="784" y2="350" stroke="#16171A" stroke-width="1.5" stroke-dasharray="3 5" opacity=".45"/>

      <text x="216" y="392" font-size="15" letter-spacing="2" class="q">WRITTEN FOR</text>
      <text x="216" y="430" font-size="17" letter-spacing=".5">PURPOSE</text>
      <text x="784" y="430" font-size="17" letter-spacing=".5" text-anchor="end" class="q">CURIOSITY</text>
      <text x="216" y="462" font-size="17" letter-spacing=".5">BACKGROUND</text>
      <text x="784" y="462" font-size="17" letter-spacing=".5" text-anchor="end" class="q">DESIGN</text>
      <text x="216" y="494" font-size="17" letter-spacing=".5">KNOWS ALREADY</text>
      <text x="784" y="494" font-size="17" letter-spacing=".5" text-anchor="end" class="q">A LITTLE</text>
      <text x="216" y="526" font-size="17" letter-spacing=".5">DEPTH</text>
      <text x="784" y="526" font-size="17" letter-spacing=".5" text-anchor="end" class="q">GO FURTHER</text>

      <line x1="216" y1="562" x2="784" y2="562" stroke="#16171A" stroke-width="1.5" stroke-dasharray="3 5" opacity=".45"/>
      <text x="216" y="602" font-size="15" letter-spacing="2" class="q">CONCEPT MAP</text>
    </g>
    <!-- the map, drawn as it builds -->
    <g stroke="#16171A" stroke-width="2" fill="none">
      <path d="M280 680 L420 650 M420 650 L560 692 M420 650 L452 760 M560 692 L700 664 M452 760 L592 782 M560 692 L592 782"/>
    </g>
    <g fill="#16171A">
      <circle cx="280" cy="680" r="9"/>
      <circle cx="420" cy="650" r="13"/>
      <circle cx="560" cy="692" r="9"/>
      <circle cx="452" cy="760" r="9"/>
      <circle cx="592" cy="782" r="9"/>
    </g>
    <circle cx="700" cy="664" r="11" fill="#E7E5DF" stroke="#16171A" stroke-width="2" stroke-dasharray="3 3"/>
  </g>
</svg>
