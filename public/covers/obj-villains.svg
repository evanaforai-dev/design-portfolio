<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- A Century of Villains · the finding, as one shape. Warm band is the
       personal villain, cool band the systemic one. The crossing at the right
       edge is the 2020s tipping systemic for the first time. -->
  <style>
    .m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #16171A; }
    .q { opacity: .45; }
  </style>
  <rect width="1000" height="1000" fill="#E7E5DF"/>
  <g class="m">
    <text x="120" y="188" font-size="19" letter-spacing="2.5" class="q">PERSONAL · SYSTEMIC</text>
    <text x="880" y="188" font-size="19" letter-spacing="2.5" text-anchor="end" class="q">495 FILMS</text>
  </g>
  <!-- personal (warm), thinning across the century -->
  <path d="M120 342 C300 330 600 336 880 330 L880 430 C600 470 300 570 120 610 Z" fill="#AC5A3E"/>
  <!-- systemic (cool), thickening -->
  <path d="M880 430 C600 470 300 570 120 610 L120 658 C300 660 600 668 880 662 Z" fill="#4E6B75"/>
  <!-- the crossing, marked where the bands reach parity -->
  <line x1="806" y1="300" x2="806" y2="700" stroke="#16171A" stroke-width="1.5" stroke-dasharray="4 6" opacity=".55"/>
  <g class="m">
    <text x="806" y="286" font-size="16" letter-spacing="1.5" text-anchor="middle">PARITY</text>
    <line x1="120" y1="726" x2="880" y2="726" stroke="#16171A" stroke-width="1.5" opacity=".3"/>
    <text x="120" y="760" font-size="16" letter-spacing="1.5" class="q">1930s</text>
    <text x="880" y="760" font-size="16" letter-spacing="1.5" text-anchor="end" class="q">2020s</text>
    <text x="120" y="838" font-size="17" letter-spacing="1.5">THE ENEMY STOPS BEING A MAN</text>
    <text x="120" y="866" font-size="17" letter-spacing="1.5">AND BECOMES A SYSTEM</text>
  </g>
</svg>
